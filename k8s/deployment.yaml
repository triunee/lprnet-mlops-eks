apiVersion: apps/v1
kind: Deployment
metadata:
  name: lprnet-inference
  labels:
    app: lprnet-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lprnet-inference
  template:
    metadata:
      labels:
        app: lprnet-inference
    spec:
      containers:
        - name: lprnet
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPO}:${IMAGE_TAG}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
